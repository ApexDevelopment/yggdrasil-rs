[package]
name = "yggdrasil-mesh"
version = "0.1.0"
edition = "2024"
description = "A Rust port of Yggdrasil, an end-to-end encrypted IPv6 mesh network"
license-file = "LICENSE"
repository = "https://github.com/ApexDevelopment/yggdrasil-rs"
readme = "README.md"
keywords = ["yggdrasil", "mesh", "network", "ipv6", "vpn"]
categories = ["network-programming", "command-line-utilities"]
exclude = ["dist/"]

[lib]
name = "yggdrasil"

[features]
default = ["tun"]
# The TUN adapter used by the yggdrasil binary
tun = ["dep:tun-rs"]

[dependencies]
petrified = { path = "../petrified", version = "0.1.0" }
base64 = "0.23.1"
blake2b_simd = "1.0.5"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
log = { version = "0.4.35", features = ["std"] }
netdev = { version = "0.47.0", default-features = false }
percent-encoding = "2.3.2"
quinn = { version = "0.11.12", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = "0.7.20"
tun-rs = { version = "2.8.18", features = ["async_tokio"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
syslog = "7.0.0"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
tempfile = "3.27.0"

[package.metadata.deb]
name = "yggdrasil"
maintainer = "yggdrasil-rs developers"
section = "net"
extended-description = "An end-to-end encrypted IPv6 mesh network, compatible with yggdrasil-go."
depends = "libc6 (>= 2.34), libgcc-s1"
maintainer-scripts = "contrib/deb/"
assets = [
	["target/release/yggdrasil", "usr/bin/", "755"],
	["target/release/yggdrasilctl", "usr/bin/", "755"],
	["target/release/genkeys", "usr/bin/", "755"],
	["README.md", "usr/share/doc/yggdrasil/", "644"],
]
systemd-units = [
	{ unit-name = "yggdrasil", unit-scripts = "contrib/systemd", enable = true, start = true },
	{ unit-name = "yggdrasil-default-config", unit-scripts = "contrib/systemd", enable = false, start = false },
]

[package.metadata.generate-rpm]
name = "yggdrasil"
# The LICENSE file adds yggdrasil-go's static linking exception
license = "LGPL-3.0-only"
summary = "End-to-end encrypted IPv6 mesh network"
assets = [
	{ source = "target/release/yggdrasil", dest = "/usr/bin/yggdrasil", mode = "755" },
	{ source = "target/release/yggdrasilctl", dest = "/usr/bin/yggdrasilctl", mode = "755" },
	{ source = "target/release/genkeys", dest = "/usr/bin/genkeys", mode = "755" },
	{ source = "contrib/systemd/yggdrasil.service", dest = "/usr/lib/systemd/system/yggdrasil.service", mode = "644" },
	{ source = "contrib/systemd/yggdrasil-default-config.service", dest = "/usr/lib/systemd/system/yggdrasil-default-config.service", mode = "644" },
	{ source = "README.md", dest = "/usr/share/doc/yggdrasil/README.md", mode = "644", doc = true },
	{ source = "LICENSE", dest = "/usr/share/licenses/yggdrasil/LICENSE", mode = "644", doc = true },
]
post_install_script = "contrib/rpm/post_install.sh"
pre_uninstall_script = "contrib/rpm/pre_uninstall.sh"
post_uninstall_script = "contrib/rpm/post_uninstall.sh"
